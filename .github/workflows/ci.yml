name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # The Worklog gate resolves evidence pinned to historical commits.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify pinned toolchain
        run: |
          test "$(node --version)" = "v$(cat .node-version)"
          test "npm@$(npm --version)" = "$(node -p "require('./package.json').packageManager")"

      - name: Install locked dependencies
        run: npm ci

      - name: Verify repository
        run: npm run verify

      - name: Verify Phase 3 production-browser flow
        run: npm run test:e2e

      - name: Verify public AI Worklog
        run: npm run test:e2e:worklog

      - name: Verify Phase 5 observation management
        run: npm run test:e2e:manage-observations

      - name: Verify Phase 6 accessibility states
        run: npm run test:a11y

      - name: Verify Phase 6 responsive keyboard flow
        run: npm run test:e2e:responsive-keyboard
